services:
  php-fpm:
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: 1000
        GID: 1000
    volumes:
      - ./:/var/www
  web:
    image: nginx:alpine
    volumes:
      - ./docker/development/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www
    ports:
      - "80:80"
    depends_on:
      - php-fpm


